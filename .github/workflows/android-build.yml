name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Отменять устаревшие запуски для той же ветки/PR
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Минимальные права для GITHUB_TOKEN
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: "17"
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Проверка gradle-wrapper + кеш Gradle (заменяет cache: gradle)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Нужен как запасной вариант, если gradlew нет в репозитории
          gradle-version: "8.13"

      # Лицензии принимаются автоматически, ANDROID_HOME выставляется сам
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::warning::gradlew не найден в репозитории — генерирую wrapper. Закоммить gradlew и gradle/wrapper/*"
            ls -la
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperBoost-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # При падении сборки — сохранить отчёты для разбора
      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
