name: Build debug APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack project
        run: |
          mkdir work
          unzip -q anilibria-glass-full.zip -d work
          cd work/*/
          printf 'storeFile=debug.keystore\nstorePassword=x\nkeyAlias=x\nkeyPassword=x\n' > local.properties
          chmod +x gradlew
          echo "PROJECT_DIR=$(pwd)" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app-mobile:assembleAppDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anilibria-glass-debug-apk
          path: ${{ env.PROJECT_DIR }}/app-mobile/build/outputs/apk/app/debug/*.apk
